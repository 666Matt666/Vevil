# Auto-merge de Pull Requests cuando los tests pasan
# Se activa cuando un PR es aprobado y los checks pasan

name: Auto Merge PR

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    if: |
      (github.event.review.state == 'approved') ||
      (github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto merge PR
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          merge-method: squash
