# Deploy: Despliegue automatico a Fly.io segun la rama
# main -> produccion (vevil-dtt7ta)
# develop -> desarrollo (vevil-dev)

name: Deploy to Fly.io

on:
  push:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vevil-system
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vevil-system/backend-vevil/package-lock.json

      - name: Install dependencies
        run: cd backend-vevil && npm ci

      - name: Run tests
        run: cd backend-vevil && npm test -- --passWithNoTests

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Production
        run: flyctl deploy --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-development:
    name: Deploy to Development
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vevil-system
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vevil-system/backend-vevil/package-lock.json

      - name: Install dependencies
        run: cd backend-vevil && npm ci

      - name: Run tests
        run: cd backend-vevil && npm test -- --passWithNoTests

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Development
        run: flyctl deploy --config fly.dev.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
