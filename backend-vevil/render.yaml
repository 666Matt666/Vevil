# Configuración para Render.com (Blueprint / New from Repo)
# Para un servicio ya creado en el Dashboard, configurá Build y Start Command ahí.

services:
  - type: web
    name: vevil-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    # Migraciones automáticas antes de cada deploy (plan pago). Si fallan, el deploy se cancela.
    preDeployCommand: npm run migration:run:prod
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false











