# CI: tests del backend y frontend en cada push/PR a main.
# El deploy lo siguen haciendo Render y Vercel; este workflow solo valida que los tests pasen.

name: CI

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend-vevil/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend-vevil

      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: backend-vevil

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-vevil/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-vevil

       - name: Run frontend tests
         run: npm test
         working-directory: frontend-vevil

   e2e-tests:
     name: E2E tests (Playwright)
     runs-on: ubuntu-latest
     needs: [backend-tests, frontend-tests]
     if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
     steps:
       - uses: actions/checkout@v4

       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: '24'
           cache: 'npm'
           cache-dependency-path: frontend-vevil/package-lock.json

       - name: Install frontend dependencies
         run: npm ci
         working-directory: frontend-vevil

       - name: Build frontend
         run: npm run build
         working-directory: frontend-vevil

       - name: Install Playwright browsers and dependencies
         run: npx playwright install --with-deps
         working-directory: frontend-vevil

       - name: Start backend server
         run: |
           cd backend-vevil
           npm ci
           npm run build
           npm run start &
           sleep 10  # Wait for server to start
         env:
           DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
           DB_PORT: ${{ secrets.DB_PORT || '5432' }}
           DB_USERNAME: ${{ secrets.DB_USERNAME || 'postgres' }}
           DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'admin' }}
           DB_DATABASE: ${{ secrets.DB_DATABASE || 'vevil_db' }}
           JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret' }}
           NODE_ENV: test

       - name: Run E2E tests
         run: |
           cd frontend-vevil
           npx playwright test --reporter=list
         env:
           VITE_API_URL: http://localhost:3000/api
           CI: true

       - name: Upload Playwright report
         if: always()
         uses: actions/upload-artifact@v3
         with:
           name: playwright-report
           path: frontend-vevil/playwright-report/
           retention-days: 30
